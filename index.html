<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rede Social | Perfil & Galeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #f5f5f5; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        @keyframes progressAnimation {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .story-progress-bar { animation: progressAnimation 30s linear forwards; }
    </style>
</head>
<body class="bg-black text-white antialiased selection:bg-pink-500 selection:text-white w-full overflow-x-hidden">

    <div class="flex min-h-screen w-full relative">
        <!-- SIDEBAR DESKTOP -->
        <aside class="hidden md:flex flex-col justify-between w-64 border-r border-zinc-800 px-4 py-6 fixed h-screen bg-black z-30">
            <div>
                <a href="#" class="block px-3 mb-8">
                    <span id="siteLogoText" class="text-2xl font-bold tracking-tight bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 bg-clip-text text-transparent truncate block">InstaSocial</span>
                </a>
                <nav class="space-y-2">
                    <button onclick="scrollToTop()" class="flex items-center gap-4 w-full px-3 py-3 rounded-xl hover:bg-zinc-900 transition font-semibold text-white"><i data-lucide="home" class="w-6 h-6 flex-shrink-0"></i> Página Inicial</button>
                    <button onclick="requestUploadAccess('post')" class="flex items-center gap-4 w-full px-3 py-3 rounded-xl hover:bg-zinc-900 transition text-zinc-300"><i data-lucide="plus-square" class="w-6 h-6 flex-shrink-0"></i> Criar Post</button>
                    <button onclick="requestUploadAccess('story')" class="flex items-center gap-4 w-full px-3 py-3 rounded-xl hover:bg-zinc-900 transition text-zinc-300"><i data-lucide="circle-plus" class="w-6 h-6 flex-shrink-0"></i> Postar Story</button>
                    <button onclick="requestUploadAccess('highlight')" class="flex items-center gap-4 w-full px-3 py-3 rounded-xl hover:bg-zinc-900 transition text-zinc-300"><i data-lucide="sparkles" class="w-6 h-6 flex-shrink-0"></i> Novo Destaque</button>
                    <button onclick="requestSettingsAccess()" class="flex items-center gap-4 w-full px-3 py-3 rounded-xl hover:bg-zinc-900 transition text-zinc-300"><i data-lucide="settings" class="w-6 h-6 flex-shrink-0"></i> Configurações</button>
                </nav>
            </div>
            <div onclick="requestSettingsAccess()" class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-zinc-900 cursor-pointer transition border border-zinc-800/60">
                <img id="sidebarAvatar" src="" class="w-10 h-10 rounded-full object-cover border border-zinc-700 flex-shrink-0">
                <div class="overflow-hidden min-w-0">
                    <p id="sidebarDisplayName" class="text-sm font-semibold truncate">Carregando...</p>
                    <p id="sidebarUsername" class="text-xs text-zinc-400 truncate">@...</p>
                </div>
            </div>
        </aside>

        <!-- HEADER MOBILE -->
        <header class="md:hidden fixed top-0 w-full bg-black/95 backdrop-blur-md border-b border-zinc-800 px-4 h-14 flex items-center justify-between z-40">
            <span id="siteLogoTextMobile" class="text-lg font-bold bg-gradient-to-r from-amber-400 via-pink-500 to-purple-600 bg-clip-text text-transparent truncate max-w-[180px]">InstaSocial</span>
            <div class="flex items-center gap-3">
                <button onclick="requestUploadAccess('story')" class="text-white p-1"><i data-lucide="circle-plus" class="w-6 h-6"></i></button>
                <button onclick="requestUploadAccess('post')" class="text-white p-1"><i data-lucide="plus-square" class="w-6 h-6"></i></button>
                <button onclick="requestSettingsAccess()" class="text-white p-1"><i data-lucide="settings" class="w-6 h-6"></i></button>
            </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 md:ml-64 flex justify-center w-full pt-16 md:pt-8 pb-24 px-3 sm:px-6 overflow-x-hidden">
            <div class="w-full max-w-[540px]">
                <section class="mb-6 pb-6 border-b border-zinc-800 w-full">
                    <div class="flex items-center gap-4 sm:gap-6 mb-5 w-full">
                        <div id="profileStoryRing" onclick="openUserStories()" class="p-[3px] rounded-full cursor-pointer transition hover:scale-105 bg-zinc-800 flex-shrink-0">
                            <div class="p-[2px] bg-black rounded-full">
                                <img id="profileAvatar" src="" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover">
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                <h1 id="profileUsername" class="text-base sm:text-lg font-semibold truncate max-w-[150px]">voce.oficial</h1>
                                <button onclick="requestSettingsAccess()" class="bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 flex-shrink-0"><i data-lucide="lock" class="w-3.5 h-3.5 text-zinc-400"></i> Editar</button>
                            </div>
                            <p id="profileDisplayName" class="text-sm font-semibold text-white mb-1 truncate">Seu Perfil</p>
                            <p id="profileBio" class="text-xs sm:text-sm text-zinc-300 whitespace-pre-line leading-relaxed break-words mb-2"></p>
                            <div class="flex gap-4 mt-3 text-xs text-zinc-400">
                                <span><strong id="postsCount" class="text-white">0</strong> posts</span>
                                <span><strong id="storiesCount" class="text-white">0</strong> stories</span>
                            </div>
                        </div>
                    </div>
                    <div class="w-full mt-4">
                        <div id="highlightsContainer" class="flex items-center gap-4 overflow-x-auto no-scrollbar py-2 w-full"></div>
                    </div>
                </section>

                <div class="mb-5 relative w-full">
                    <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-3"></i>
                    <input type="text" id="searchInput" oninput="renderFeed()" placeholder="Pesquisar publicações..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-2 pl-10 pr-4 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-600">
                </div>

                <div id="loadingIndicator" class="text-center py-10 text-zinc-400 text-sm">Carregando dados do Supabase...</div>
                <div id="feedContainer" class="space-y-6 w-full"></div>
            </div>
        </main>

        <!-- BARRA INFERIOR MOBILE -->
        <nav class="md:hidden fixed bottom-0 left-0 w-full bg-black/95 backdrop-blur-md border-t border-zinc-800 h-14 flex items-center justify-around z-40">
            <button onclick="scrollToTop()" class="p-2 text-white"><i data-lucide="home" class="w-6 h-6"></i></button>
            <button onclick="requestUploadAccess('post')" class="p-2 text-zinc-300"><i data-lucide="plus-square" class="w-6 h-6"></i></button>
            <button onclick="requestUploadAccess('story')" class="p-2 text-zinc-300"><i data-lucide="circle-plus" class="w-6 h-6"></i></button>
            <button onclick="requestUploadAccess('highlight')" class="p-2 text-zinc-300"><i data-lucide="sparkles" class="w-6 h-6"></i></button>
            <button onclick="requestSettingsAccess()" class="p-2 text-zinc-300"><i data-lucide="settings" class="w-6 h-6"></i></button>
        </nav>
    </div>

    <!-- MODAL DE SENHA GERAL (UPLOAD / APAGAR) -->
    <div id="uploadPasswordModal" class="fixed inset-0 z-[999] hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('uploadPasswordModal')">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xs p-5 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h3 id="uploadPasswordTitle" class="font-semibold text-sm flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4 text-pink-500"></i> Acesso Restrito</h3>
                <button onclick="closeModal('uploadPasswordModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="verifyUploadPassword(event)" class="space-y-3">
                <p class="text-xs text-zinc-400">Digite a senha:</p>
                <input type="password" id="uploadPasswordInput" required placeholder="••••••" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white text-center tracking-widest focus:outline-none focus:border-pink-500">
                <p id="uploadPasswordErrorMsg" class="text-xs text-red-400 hidden text-center">Senha incorreta!</p>
                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2 rounded-lg text-sm transition">Confirmar</button>
            </form>
        </div>
    </div>

    <!-- MODAL SENHA CONFIGURAÇÕES -->
    <div id="passwordModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('passwordModal')">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xs p-5 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-sm flex items-center gap-2"><i data-lucide="lock" class="w-4 h-4 text-pink-500"></i> Restrito</h3>
                <button onclick="closeModal('passwordModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="verifySettingsPassword(event)" class="space-y-3">
                <p class="text-xs text-zinc-400">Digite a senha:</p>
                <input type="password" id="settingsPasswordInput" required placeholder="•••••••••" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white text-center tracking-widest focus:outline-none focus:border-pink-500">
                <p id="passwordErrorMsg" class="text-xs text-red-400 hidden text-center">Senha incorreta!</p>
                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2 rounded-lg text-sm transition">Entrar</button>
            </form>
        </div>
    </div>

    <!-- MODAL CONFIGURAÇÕES -->
    <div id="settingsModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('settingsModal')">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between pb-3 border-b border-zinc-800 mb-4">
                <h3 class="font-semibold text-sm">Configurações Gerais</h3>
                <button onclick="closeModal('settingsModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="saveProfileSettings(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Nome do Site (Logo)</label>
                        <input type="text" id="editSiteTitle" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Cor / Estilo do Degradê</label>
                        <select id="editGradientStyle" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                            <option value="from-amber-400 via-pink-500 to-purple-600">Instagram Clássico</option>
                            <option value="from-cyan-400 via-indigo-500 to-purple-600">Neon Moderno</option>
                            <option value="from-green-400 via-teal-500 to-blue-600">Natureza</option>
                            <option value="from-yellow-400 via-orange-500 to-red-600">Sunset Quente</option>
                            <option value="from-slate-200 via-zinc-400 to-zinc-600">Prata Metálico</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4 pt-2 border-t border-zinc-800">
                    <img id="editAvatarPreview" src="" class="w-14 h-14 rounded-full object-cover border border-zinc-700 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs text-zinc-400 mb-1">Foto de Perfil</label>
                        <input type="file" id="editAvatarFile" accept="image/*" onchange="previewEditAvatar(event)" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:bg-zinc-800 file:text-white cursor-pointer">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Nome de Exibição</label>
                        <input type="text" id="editDisplayName" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Usuário (@)</label>
                        <input type="text" id="editUsername" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Biografia Principal</label>
                    <textarea id="editBio" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none"></textarea>
                </div>
                <button type="submit" id="btnSaveProfile" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg text-sm transition mt-4">Salvar Alterações</button>
            </form>
        </div>
    </div>

    <!-- MODAL CRIAR POST / STORY -->
    <div id="createModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('createModal')">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800">
                <h3 class="font-semibold text-sm">Criar Publicação</h3>
                <button onclick="closeModal('createModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleNewMediaSubmit(event)" class="p-4 space-y-4">
                <div class="grid grid-cols-2 gap-2 bg-zinc-950 p-1 rounded-xl border border-zinc-800">
                    <button type="button" id="tabTypePost" onclick="setCreateDestination('post')" class="py-2 rounded-lg text-xs font-semibold bg-zinc-800 text-white transition">Feed (Múltiplas Fotos)</button>
                    <button type="button" id="tabTypeStory" onclick="setCreateDestination('story')" class="py-2 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white transition">Story</button>
                </div>
                <input type="hidden" id="createDestination" value="post">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1" id="fileInputLabel">Selecione uma ou mais fotos/vídeos</label>
                    <input type="file" id="newFileInput" multiple accept="image/*,video/mp4,video/webm" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:bg-pink-600 file:text-white cursor-pointer">
                </div>
                <div id="postOnlyFields" class="space-y-4">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Localização</label>
                        <input type="text" id="newLocation" placeholder="Ex: Betim, MG" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Legenda</label>
                        <textarea id="newCaption" rows="3" placeholder="Escreva uma legenda..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none"></textarea>
                    </div>
                </div>
                <button type="submit" id="btnSubmitPost" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2.5 rounded-lg text-sm transition">Publicar</button>
            </form>
        </div>
    </div>

    <!-- MODAL NOVO DESTAQUE -->
    <div id="highlightModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('highlightModal')">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800">
                <h3 class="font-semibold text-sm">Novo Destaque</h3>
                <button onclick="closeModal('highlightModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleNewHighlight(event)" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Título</label>
                    <input type="text" id="highlightTitle" maxlength="18" required placeholder="Nome..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Mídia do Destaque</label>
                    <input type="file" id="highlightFileInput" required accept="image/*,video/mp4,video/webm" class="w-full text-xs text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:bg-pink-600 file:text-white cursor-pointer">
                </div>
                <button type="submit" id="btnSubmitHighlight" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">Salvar</button>
            </form>
        </div>
    </div>

    <!-- VISUALIZADOR DE STORIES COM BARRA DE 30s E BOTÃO DE APAGAR -->
    <div id="storyViewerModal" class="fixed inset-0 z-50 hidden bg-black/95 flex flex-col items-center justify-center p-2 sm:p-4">
        <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-30 max-w-sm mx-auto w-full px-2">
            <div class="flex items-center gap-2">
                <img id="storyViewerAvatar" src="" class="w-8 h-8 rounded-full object-cover border border-white">
                <span id="storyViewerUser" class="text-sm font-semibold text-white"></span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="requestDeleteStoryAccess()" class="bg-zinc-800/80 hover:bg-red-600 text-white p-1.5 rounded-lg transition" title="Apagar Story">
                    <i data-lucide="trash-2" class="w-5 h-5 text-red-400"></i>
                </button>
                <button onclick="closeStoryViewer()" class="text-white p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
        </div>

        <div class="absolute top-2 left-4 right-4 max-w-sm mx-auto h-1 bg-zinc-700 rounded-full overflow-hidden z-30">
            <div id="storyProgressBar" class="h-full bg-white story-progress-bar"></div>
        </div>

        <div class="relative w-full max-w-sm aspect-[9/16] bg-zinc-900 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
            <div id="storyMediaContainer" class="w-full h-full flex items-center justify-center bg-black"></div>
        </div>
    </div>

    <!-- VISUALIZADOR DE ZOOM (POSTS E DESTAQUES) -->
    <div id="zoomModal" class="fixed inset-0 z-50 hidden bg-black/95 flex flex-col items-center justify-center p-2 sm:p-4">
        <div class="absolute top-4 left-4 right-4 flex items-center justify-between z-30 max-w-4xl mx-auto w-full px-2">
            <button onclick="closeZoomModal()" class="bg-zinc-800/80 hover:bg-zinc-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar / Fechar
            </button>
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="openLinkToHighlightModalFromZoom()" class="bg-pink-600/80 hover:bg-pink-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="sparkles" class="w-4 h-4 text-white"></i> Destaque
                </button>
                <button onclick="requestDownloadCurrent()" class="bg-zinc-800/80 hover:bg-zinc-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="download" class="w-4 h-4 text-sky-400"></i> Baixar
                </button>
                <button onclick="requestDeleteZoomAccess()" class="bg-zinc-800/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i> Excluir
                </button>
            </div>
        </div>

        <div class="relative w-full max-w-3xl h-[80vh] flex items-center justify-center">
            <button id="zoomPrevBtn" onclick="prevZoomItem()" class="absolute left-2 sm:-left-12 z-20 bg-zinc-800/80 hover:bg-zinc-700 text-white p-2.5 rounded-full shadow-lg transition">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <div id="zoomMediaContainer" class="w-full h-full flex items-center justify-center"></div>
            <button id="zoomNextBtn" onclick="nextZoomItem()" class="absolute right-2 sm:-right-12 z-20 bg-zinc-800/80 hover:bg-zinc-700 text-white p-2.5 rounded-full shadow-lg transition">
                <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>
        </div>
        <div id="zoomCounter" class="text-xs text-zinc-400 mt-2 font-medium">1 / 1</div>
    </div>

    <!-- SCRIPT DA APLICAÇÃO -->
    <script>
        const SUPABASE_URL = 'https://wtujaawfxmfqgvvwkjce.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Tgu_ZkuqGcDdRxeisegrQQ_DU1-QKPx';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = {
            site_title: 'InstaSocial', gradient_from: 'from-amber-400', gradient_via: 'via-pink-500', gradient_to: 'to-purple-600',
            display_name: 'Seu Perfil', username: 'voce.oficial', avatar_url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
            bio: ''
        };

        let postsData = [], storiesData = [], highlightsData = [];
        let zoomQueue = [], zoomIndex = 0, currentTargetItem = null, pendingAction = null, pendingUploadType = 'post';
        let storyTimer = null;
        let currentStoryIndex = 0;

        async function loadAllData() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            try {
                const { data: profile } = await sb.from('insta_profile').select('*').eq('id', 1).single();
                if (profile) userProfile = Object.assign({}, userProfile, profile);
                renderProfileUI();

                const { data: stories } = await sb.from('insta_stories').select('*').order('created_at', { ascending: true });
                const now = new Date().getTime();
                const twentyFourHours = 24 * 60 * 60 * 1000;
                
                storiesData = (stories || []).filter(s => {
                    const createdTime = new Date(s.created_at).getTime();
                    return (now - createdTime) < twentyFourHours;
                });
                renderStoriesRing();

                const { data: highlights } = await sb.from('insta_highlights').select('*').order('created_at', { ascending: true });
                highlightsData = highlights || [];
                renderHighlights();

                const { data: posts, error } = await sb.from('insta_posts').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                postsData = posts || [];
                document.getElementById('postsCount').innerText = postsData.length;
                renderFeed();
            } catch (err) {
                console.error('Erro:', err);
                document.getElementById('feedContainer').innerHTML = `<p class="text-red-400 text-sm text-center">Erro ao carregar dados do Supabase.</p>`;
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function renderProfileUI() {
            const logoEl = document.getElementById('siteLogoText');
            const logoElMob = document.getElementById('siteLogoTextMobile');
            const gradClass = `bg-gradient-to-r ${userProfile.gradient_from || 'from-amber-400'} ${userProfile.gradient_via || 'via-pink-500'} ${userProfile.gradient_to || 'to-purple-600'} bg-clip-text text-transparent`;
            
            logoEl.innerText = userProfile.site_title || 'InstaSocial';
            logoEl.className = `text-2xl font-bold tracking-tight ${gradClass} truncate`;
            logoElMob.innerText = userProfile.site_title || 'InstaSocial';
            logoElMob.className = `text-lg font-bold ${gradClass} truncate`;

            document.getElementById('sidebarAvatar').src = userProfile.avatar_url;
            document.getElementById('sidebarDisplayName').innerText = userProfile.display_name;
            document.getElementById('sidebarUsername').innerText = '@' + userProfile.username;
            document.getElementById('profileAvatar').src = userProfile.avatar_url;
            document.getElementById('profileUsername').innerText = userProfile.username;
            document.getElementById('profileDisplayName').innerText = userProfile.display_name;
            document.getElementById('profileBio').innerText = userProfile.bio || '';
        }

        function renderStoriesRing() {
            const ring = document.getElementById('profileStoryRing');
            document.getElementById('storiesCount').innerText = storiesData.length;
            if (storiesData.length > 0) ring.classList.add('story-ring');
            else ring.classList.remove('story-ring');
        }

        function renderHighlights() {
            const container = document.getElementById('highlightsContainer');
            let html = highlightsData.map((h, idx) => `
                <button onclick="openHighlightZoom(${idx})" class="flex flex-col items-center flex-shrink-0 gap-1.5 group">
                    <div class="p-[2px] rounded-full border border-zinc-700 group-hover:border-zinc-400 transition">
                        <div class="p-[2px] bg-black rounded-full">
                            <img src="${h.cover_url}" alt="${h.title}" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover">
                        </div>
                    </div>
                    <span class="text-xs text-zinc-200 max-w-[70px] truncate">${h.title}</span>
                </button>
            `).join('');

            html += `
                <button onclick="requestUploadAccess('highlight')" class="flex flex-col items-center flex-shrink-0 gap-1.5 group">
                    <div class="w-[60px] h-[60px] sm:w-[68px] sm:h-[68px] rounded-full border border-zinc-800 bg-zinc-950 flex items-center justify-center group-hover:border-zinc-600 transition">
                        <i data-lucide="plus" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    </div>
                    <span class="text-xs text-zinc-400">Novo</span>
                </button>
            `;
            container.innerHTML = html;
            lucide.createIcons();
        }

        function openUserStories() {
            if (storiesData.length === 0) { requestUploadAccess('story'); return; }
            currentStoryIndex = 0;
            showStorySlide();
        }

        function showStorySlide() {
            clearTimeout(storyTimer);
            if (currentStoryIndex >= storiesData.length) {
                closeStoryViewer();
                return;
            }

            const story = storiesData[currentStoryIndex];
            currentTargetItem = { type: 'story', id: story.id, media_url: story.story_url };

            document.getElementById('storyViewerModal').classList.remove('hidden');
            document.getElementById('storyViewerAvatar').src = userProfile.avatar_url;
            document.getElementById('storyViewerUser').innerText = userProfile.username;

            const container = document.getElementById('storyMediaContainer');
            const isVideo = story.story_url.match(/\.(mp4|webm|ogg)$/i);

            if (isVideo) {
                container.innerHTML = `<video src="${story.story_url}" autoplay playsinline class="w-full h-full object-contain"></video>`;
            } else {
                container.innerHTML = `<img src="${story.story_url}" class="w-full h-full object-contain">`;
            }

            const bar = document.getElementById('storyProgressBar');
            bar.style.animation = 'none';
            void bar.offsetWidth;
            bar.style.animation = 'progressAnimation 30s linear forwards';

            storyTimer = setTimeout(() => {
                currentStoryIndex++;
                showStorySlide();
            }, 30000);

            lucide.createIcons();
        }

        function closeStoryViewer() {
            clearTimeout(storyTimer);
            document.getElementById('storyViewerModal').classList.add('hidden');
        }

        function openPostZoom(postId, mediaIndex = 0) {
            const post = postsData.find(p => p.id === postId);
            if (!post) return;
            const urls = post.media_urls && post.media_urls.length > 0 ? post.media_urls : [post.media_url];
            
            zoomQueue = urls.map(url => ({
                type: 'post', id: post.id, media_url: url,
                media_type: url.match(/\.(mp4|webm|ogg)$/i) ? 'video' : 'image'
            }));
            zoomIndex = mediaIndex;
            showZoomSlide();
        }

        function openHighlightZoom(idx) {
            zoomQueue = highlightsData.map(h => ({
                type: 'highlight', id: h.id, media_url: h.media_url, media_type: h.media_type
            }));
            zoomIndex = idx;
            showZoomSlide();
        }

        function showZoomSlide() {
            const item = zoomQueue[zoomIndex];
            if (!item) { closeZoomModal(); return; }
            currentTargetItem = item;

            document.getElementById('zoomModal').classList.remove('hidden');
            const container = document.getElementById('zoomMediaContainer');
            
            if (item.media_type === 'video') {
                container.innerHTML = `<video src="${item.media_url}" controls autoplay playsinline class="max-w-full max-h-full object-contain rounded-lg"></video>`;
            } else {
                container.innerHTML = `<img src="${item.media_url}" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl">`;
            }

            document.getElementById('zoomPrevBtn').style.display = zoomQueue.length > 1 ? 'block' : 'none';
            document.getElementById('zoomNextBtn').style.display = zoomQueue.length > 1 ? 'block' : 'none';
            document.getElementById('zoomCounter').innerText = `${zoomIndex + 1} / ${zoomQueue.length}`;
            lucide.createIcons();
        }

        function nextZoomItem() {
            if (zoomIndex + 1 < zoomQueue.length) { zoomIndex++; showZoomSlide(); }
            else { zoomIndex = 0; showZoomSlide(); }
        }

        function prevZoomItem() {
            if (zoomIndex > 0) { zoomIndex--; showZoomSlide(); }
            else { zoomIndex = zoomQueue.length - 1; showZoomSlide(); }
        }

        function closeZoomModal() {
            document.getElementById('zoomMediaContainer').innerHTML = '';
            document.getElementById('zoomModal').classList.add('hidden');
        }

        // =====================================================================
        // CONTROLE DE SENHA E EXCLUSÃO (102104)
        // =====================================================================
        function requestUploadAccess(type) {
            pendingUploadType = type;
            pendingAction = 'upload';
            document.getElementById('uploadPasswordInput').value = '';
            document.getElementById('uploadPasswordErrorMsg').classList.add('hidden');
            document.getElementById('uploadPasswordTitle').innerHTML = `<i data-lucide="lock" class="w-4 h-4 text-pink-500"></i> Acesso Restrito`;
            document.getElementById('uploadPasswordModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('uploadPasswordInput').focus(), 100);
            lucide.createIcons();
        }

        function requestDeleteStoryAccess() {
            pendingAction = 'delete_story';
            document.getElementById('uploadPasswordInput').value = '';
            document.getElementById('uploadPasswordErrorMsg').classList.add('hidden');
            document.getElementById('uploadPasswordTitle').innerHTML = `<i data-lucide="lock" class="w-4 h-4 text-red-500"></i> Senha para Apagar Story`;
            document.getElementById('uploadPasswordModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('uploadPasswordInput').focus(), 100);
            lucide.createIcons();
        }

        function requestDeleteZoomAccess() {
            pendingAction = 'delete_zoom';
            document.getElementById('uploadPasswordInput').value = '';
            document.getElementById('uploadPasswordErrorMsg').classList.add('hidden');
            document.getElementById('uploadPasswordTitle').innerHTML = `<i data-lucide="lock" class="w-4 h-4 text-red-500"></i> Senha para Excluir`;
            document.getElementById('uploadPasswordModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('uploadPasswordInput').focus(), 100);
            lucide.createIcons();
        }

        function requestDownloadCurrent() {
            if (!currentTargetItem) return;
            const a = document.createElement('a');
            a.href = currentTargetItem.media_url;
            a.download = 'download_' + Date.now();
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function verifyUploadPassword(event) {
            event.preventDefault();
            const pass = document.getElementById('uploadPasswordInput').value;
            if (pass !== '102104') {
                document.getElementById('uploadPasswordErrorMsg').classList.remove('hidden');
                return;
            }
            closeModal('uploadPasswordModal');

            if (pendingAction === 'delete_story') {
                if (!currentTargetItem) return;
                await sb.from('insta_stories').delete().eq('id', currentTargetItem.id);
                closeStoryViewer();
                await loadAllData();
            } else if (pendingAction === 'delete_zoom') {
                if (!currentTargetItem) return;
                if (currentTargetItem.type === 'post') {
                    await sb.from('insta_posts').delete().eq('id', currentTargetItem.id);
                } else if (currentTargetItem.type === 'highlight') {
                    await sb.from('insta_highlights').delete().eq('id', currentTargetItem.id);
                } else if (currentTargetItem.type === 'story') {
                    await sb.from('insta_stories').delete().eq('id', currentTargetItem.id);
                }
                closeZoomModal();
                await loadAllData();
            } else {
                if (pendingUploadType === 'highlight') {
                    openHighlightModal();
                } else {
                    openCreateModal(pendingUploadType);
                }
            }
        }

        async function toggleLike(id) {
            const post = postsData.find(p => p.id === id);
            if (!post) return;
            
            let likedPostsLocal = JSON.parse(localStorage.getItem('insta_liked_global') || '[]');
            const isLiked = likedPostsLocal.includes(id);

            if (isLiked) {
                likedPostsLocal = likedPostsLocal.filter(i => i !== id);
                post.likes_count = Math.max(0, (post.likes_count || 0) - 1);
            } else {
                likedPostsLocal.push(id);
                post.likes_count = (post.likes_count || 0) + 1;
            }
            localStorage.setItem('insta_liked_global', JSON.stringify(likedPostsLocal));

            renderFeed();
            await sb.from('insta_posts').update({ likes_count: post.likes_count }).eq('id', id);
        }

        function renderFeed() {
            const container = document.getElementById('feedContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = postsData.filter(p => (p.caption || '').toLowerCase().includes(query) || (p.location || '').toLowerCase().includes(query));
            let likedPostsLocal = JSON.parse(localStorage.getItem('insta_liked_global') || '[]');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-zinc-500 text-sm">Nenhuma publicação.</div>`;
                return;
            }

            container.innerHTML = filtered.map(post => {
                const isLiked = likedPostsLocal.includes(post.id);
                const urls = post.media_urls && post.media_urls.length > 0 ? post.media_urls : [post.media_url];
                const firstUrl = urls[0];
                const isVideo = firstUrl.match(/\.(mp4|webm|ogg)$/i);

                return `
                <article class="border-b border-zinc-800/80 pb-6 w-full overflow-hidden">
                    <div class="flex items-center justify-between py-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${userProfile.avatar_url}" class="w-8 h-8 rounded-full object-cover border border-zinc-700 flex-shrink-0">
                            <div class="truncate">
                                <p class="text-sm font-semibold leading-none truncate">${userProfile.username}</p>
                                ${post.location ? `<p class="text-xs text-zinc-400 mt-0.5 truncate">${post.location}</p>` : ''}
                            </div>
                        </div>
                        <button onclick="requestUploadAccess('post'); document.getElementById('editPostId').value = '${post.id}';" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editar Post
                        </button>
                    </div>
                    
                    <div class="relative w-full h-[450px] bg-zinc-900 border border-zinc-800/60 cursor-pointer overflow-hidden flex items-center justify-center group" onclick="openPostZoom(${post.id}, 0)">
                        ${isVideo ? `<video src="${firstUrl}" class="w-full h-full object-cover pointer-events-none"></video>` : `<img src="${firstUrl}" class="w-full h-full object-cover">`}
                        ${urls.length > 1 ? `<div class="absolute top-3 right-3 bg-black/70 text-white text-xs px-2.5 py-1 rounded-full font-semibold backdrop-blur-sm">${urls.length} fotos 🖼️</div>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-3 pb-2">
                        <div class="flex items-center gap-4">
                            <button onclick="toggleLike(${post.id})" class="hover:opacity-70 transition flex items-center gap-2">
                                <i data-lucide="heart" class="w-6 h-6 ${isLiked ? 'text-red-500 fill-red-500' : 'text-white'}"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm font-semibold mb-1.5">${post.likes_count || 0} curtidas</p>
                    <p class="text-sm text-zinc-200 leading-relaxed break-words"><span class="font-semibold text-white mr-1.5">${userProfile.username}</span>${post.caption || ''}</p>
                </article>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function handleNewMediaSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmitPost');
            btn.disabled = true; btn.innerText = 'Enviando...';
            try {
                const files = document.getElementById('newFileInput').files;
                if (!files || files.length === 0) return;
                const dest = document.getElementById('createDestination').value;
                
                let mediaUrls = [];
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileName = `${dest}_${Date.now()}_${i}.${file.name.split('.').pop()}`;
                    await sb.storage.from('insta_media').upload(fileName, file);
                    const url = sb.storage.from('insta_media').getPublicUrl(fileName).data.publicUrl;
                    mediaUrls.push(url);
                }

                if (dest === 'story') {
                    await sb.from('insta_stories').insert([{ username: userProfile.username, avatar_url: userProfile.avatar_url, story_url: mediaUrls[0] }]);
                } else {
                    await sb.from('insta_posts').insert([{
                        username: userProfile.username, avatar_url: userProfile.avatar_url,
                        location: document.getElementById('newLocation').value.trim(),
                        media_type: mediaUrls[0].match(/\.(mp4|webm|ogg)$/i) ? 'video' : 'image',
                        media_url: mediaUrls[0], media_urls: mediaUrls,
                        caption: document.getElementById('newCaption').value.trim(),
                        likes_count: 0
                    }]);
                }
                event.target.reset(); closeModal('createModal'); await loadAllData();
            } catch (err) { alert('Erro: ' + err.message); }
            finally { btn.disabled = false; btn.innerText = 'Publicar'; }
        }

        async function handleNewHighlight(event) {
            event.preventDefault();
            const title = document.getElementById('highlightTitle').value.trim();
            const file = document.getElementById('highlightFileInput').files[0];
            if (!file) return;
            const fileName = `highlight_${Date.now()}.${file.name.split('.').pop()}`;
            await sb.storage.from('insta_media').upload(fileName, file);
            const url = sb.storage.from('insta_media').getPublicUrl(fileName).data.publicUrl;
            await sb.from('insta_highlights').insert([{ title, cover_url: file.type.startsWith('video/') ? userProfile.avatar_url : url, media_url: url, media_type: file.type.startsWith('video/') ? 'video' : 'image' }]);
            closeModal('highlightModal'); await loadAllData();
        }

        function openHighlightModal() { document.getElementById('highlightModal').classList.remove('hidden'); }
        function openCreateModal(dest = 'post') {
            document.getElementById('createDestination').value = dest;
            document.getElementById('createModal').classList.remove('hidden');
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function requestSettingsAccess() {
            document.getElementById('settingsPasswordInput').value = '';
            document.getElementById('passwordErrorMsg').classList.add('hidden');
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function verifySettingsPassword(event) {
            event.preventDefault();
            if (document.getElementById('settingsPasswordInput').value === '123456789') {
                closeModal('passwordModal');
                openSettingsModal();
            } else {
                document.getElementById('passwordErrorMsg').classList.add('hidden');
            }
        }

        function openSettingsModal() {
            document.getElementById('editSiteTitle').value = userProfile.site_title || 'InstaSocial';
            document.getElementById('editGradientStyle').value = userProfile.gradient_from ? `${userProfile.gradient_from} ${userProfile.gradient_via} ${userProfile.gradient_to}` : 'from-amber-400 via-pink-500 to-purple-600';
            document.getElementById('editAvatarPreview').src = userProfile.avatar_url;
            document.getElementById('editDisplayName').value = userProfile.display_name;
            document.getElementById('editUsername').value = userProfile.username;
            document.getElementById('editBio').value = userProfile.bio || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function previewEditAvatar(event) {
            const file = event.target.files[0];
            if (file) document.getElementById('editAvatarPreview').src = URL.createObjectURL(file);
        }

        async function saveProfileSettings(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSaveProfile');
            btn.disabled = true; btn.innerText = 'Salvando...';
            try {
                let avatarUrl = userProfile.avatar_url;
                const file = document.getElementById('editAvatarFile').files[0];
                if (file) {
                    const fileName = `avatar_${Date.now()}.${file.name.split('.').pop()}`;
                    await sb.storage.from('insta_media').upload(fileName, file);
                    avatarUrl = sb.storage.from('insta_media').getPublicUrl(fileName).data.publicUrl;
                }
                const gradVal = document.getElementById('editGradientStyle').value.split(' ');
                const updated = {
                    id: 1, site_title: document.getElementById('editSiteTitle').value.trim(),
                    gradient_from: gradVal[0], gradient_via: gradVal[1], gradient_to: gradVal[2],
                    display_name: document.getElementById('editDisplayName').value.trim(),
                    username: document.getElementById('editUsername').value.trim(),
                    avatar_url: avatarUrl, bio: document.getElementById('editBio').value.trim()
                };
                await sb.from('insta_profile').upsert(updated);
                closeModal('settingsModal'); await loadAllData();
            } catch (err) { alert('Erro: ' + err.message); }
            finally { btn.disabled = false; btn.innerText = 'Salvar Alterações'; }
        }

        lucide.createIcons();
        loadAllData();
    </script>
</body>
</html>
